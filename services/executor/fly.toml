# Fly.io config — bobby-executor (Base trade service)
app = "bobby-executor"
primary_region = "qro"   # Querétaro, MX — closest to Anthony; use "dfw" if unavailable

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
