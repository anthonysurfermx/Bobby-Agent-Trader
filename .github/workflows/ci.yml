name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `build` runs check:api (tsc over api/) and then vite build,
      # so one step gates both the serverless functions and the app.
      - name: Typecheck + build
        run: npm run build

      - name: Playbook tests
        run: npm run test:playbooks

      - name: Risk-gate tests
        run: npm run test:risk-gate
