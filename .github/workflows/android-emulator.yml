name: Android emulator

# Runs the instrumented tests (android/app/src/androidTest) on a real Android system image and keeps
# what they leave behind: the test report, logcat and every screenshot a test saved. The `Android`
# workflow compiles them; this one runs debug and the optimized release. CI signing is ephemeral.

on:
  push:
    branches: ['android/play-rc']
    paths: ['android/**', '.github/workflows/android*.yml', 'docs/play-store/**']
  pull_request:
    # shared/harness holds the golden file every platform's follow-up planner must pass.
    paths: ['android/**', 'shared/harness/**', '.github/workflows/android-emulator.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        api: [35]
    env:
      BOBBY_TEST_BUILD_TYPE: ${{ matrix.build-type }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked viewer dependencies
        run: npm ci
      - name: Generate the bundled equipment viewer
        run: node android/nucleo/equipment-stage/build.mjs
      - name: Generate the bundled production engine
        run: python3 android/nucleo/build.py --release
      - name: Install the compile SDK
        run: |
          for android_sdk_manager in "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$android_sdk_manager" ]; then
              "$android_sdk_manager" 'platforms;android-36' 'build-tools;35.0.0'
              exit 0
            fi
          done
          echo 'Android command-line tools are missing from the hosted SDK.' >&2
          exit 1
      - name: Load public release client configuration
        env:
          BOBBY_SUPABASE_URL: ${{ vars.BOBBY_SUPABASE_URL }}
          BOBBY_SUPABASE_ANON_KEY: ${{ vars.BOBBY_SUPABASE_ANON_KEY }}
        run: python3 android/tools/export-public-client-config.py
      - name: Generate a runner-only test certificate
        if: matrix.build-type == 'Release'
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-test.jks" -storepass android -keypass android -alias ci-test -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Bobby CI disposable'
          echo "BOBBY_CI_TEST_KEYSTORE=$RUNNER_TEMP/ci-test.jks" >> "$GITHUB_ENV"
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Built before the emulator starts, so it never sits idle through a compile.
      - name: Build the app and its instrumented tests
        working-directory: android
        run: ./gradlew :app:assemble${{ matrix.build-type }} :app:assemble${{ matrix.build-type }}AndroidTest -PbobbyTestBuildType=${{ matrix.build-type == 'Release' && 'release' || 'debug' }} --no-daemon
      - name: Run the instrumented tests on an emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: android
          # A hosted runner has no GPU: the page's WebGL scene is drawn in software, and its cost grows
          # with every pixel. 720x1600 at 320 dpi is a 360x800 dp phone, the most common Android size.
          pre-emulator-launch-script: bash tools/emulator-screen.sh 720 1600 320
          # What the tests are told about this emulator: it exists for this run only (a test that changes a
          # system setting may use it), and it has no GPU (the suite that drives the WebGL page by script is skipped).
          script: bash tools/run-emulator-tests.sh -PbobbyTestBuildType=${{ matrix.build-type == 'Release' && 'release' || 'debug' }} -Pandroid.testInstrumentationRunnerArguments.bobbyOwnedEmulator=ci-throwaway -Pandroid.testInstrumentationRunnerArguments.bobbySoftwareGpu=true
      - name: Keep the report, the log and the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-${{ matrix.build-type }}-api-${{ matrix.api }}
          path: android/build/emulator
          if-no-files-found: warn
          retention-days: 14
