name: Android

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fcm: ['false', 'true']
    env:
      BOBBY_FCM_ENABLED: ${{ matrix.fcm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked viewer dependencies
        run: npm ci
      - name: Generate the bundled equipment viewer
        run: node android/nucleo/equipment-stage/build.mjs
      - name: Generate the bundled production engine
        run: python3 android/nucleo/build.py --release
      - name: Check the Android bridge
        run: node --test android/nucleo/tests/*.test.mjs
      - name: Install the compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build, test and lint Android
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
