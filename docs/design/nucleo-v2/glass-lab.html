<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glass Lab</title>
<style>
:root{--bg:#0B0A09;--ink:#F2EDE4;--ink2:#A39C91;--ink3:#8A8378;--hair:rgba(242,237,228,.08);--line:rgba(242,237,228,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:500 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
#bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 16px;background:rgba(11,10,9,.92);border-bottom:1px solid var(--hair)}
#bar b{color:var(--ink2);font-weight:500;margin-right:4px}
#bar button{background:transparent;border:1px solid var(--line);color:var(--ink2);border-radius:14px;padding:3px 10px;font:inherit;cursor:pointer}
#bar button.on{color:var(--ink);border-color:rgba(242,237,228,.4);background:rgba(242,237,228,.06)}
#bar .sep{width:1px;height:18px;background:var(--hair);margin:0 4px}
#msg{color:var(--ink3);padding:6px 16px;min-height:22px}
#wrap{position:relative;margin:0 auto}
.cell{position:absolute;overflow:hidden}
.lab{position:absolute;left:0;right:0;text-align:center;color:var(--ink2);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab i{font-style:normal;color:var(--ink3)}
#gl{position:absolute;left:0;top:0;pointer-events:none}
#bench{padding:8px 16px 24px;color:var(--ink2);white-space:pre-wrap}
iframe{position:absolute;left:-2000px;top:0;width:390px;height:844px;border:0;visibility:hidden}
</style>
</head>

  for (i = 0; i < N; i++){ [[i, 0], [i, N - 1], [0, i], [N - 1, i]].forEach(function(q){ var o = (q[1] * N + q[0]) * 4; mr += d[o]; mg += d[o + 1]; mb += d[o + 2]; cnt++; }); }
  mr /= cnt; mg /= cnt; mb /= cnt;
  var flood = new Uint8Array(N * N), qx = new Int32Array(N * N), qh = 0, qt = 0;
  function nearBg(o){ return Math.max(Math.abs(d[o] - mr), Math.abs(d[o + 1] - mg), Math.abs(d[o + 2] - mb)) <= 22; }
  for (i = 0; i < N; i++){ [i, (N - 1) * N + i, i * N, i * N + N - 1].forEach(function(p){ if (!flood[p] && nearBg(p * 4)){ flood[p] = 1; qx[qt++] = p; } }); }
  while (qh < qt){
    var p = qx[qh++], px = p % N, py = (p / N) | 0, o = p * 4;
    var nb = [px > 0 ? p - 1 : -1, px < N - 1 ? p + 1 : -1, py > 0 ? p - N : -1, py < N - 1 ? p + N : -1];
    for (k = 0; k < 4; k++){ var q = nb[k]; if (q < 0 || flood[q]) continue; var oq = q * 4;
      if (Math.max(Math.abs(d[oq] - d[o]), Math.abs(d[oq + 1] - d[o + 1]), Math.abs(d[oq + 2] - d[o + 2])) <= 5 && nearBg(oq)){ flood[q] = 1; qx[qt++] = q; } }
  }
  var A = new Float32Array(N * N), B = new Float32Array(N * N);
  for (i = 0; i < N * N; i++) A[i] = flood[i] ? 0 : 1;
  for (j = 0; j < N; j++) for (i = 0; i < N; i++){ var mn = 1; for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++){ var xx = clamp(i + dx, 0, N - 1), yy = clamp(j + dy, 0, N - 1); mn = Math.min(mn, A[yy * N + xx]); } B[j * N + i] = mn; }
  for (var pass = 0; pass < 2; pass++){
    for (j = 0; j < N; j++) for (i = 0; i < N; i++){ var s = 0; for (var ey = -1; ey <= 1; ey++) for (var ex = -1; ex <= 1; ex++){ s += B[clamp(j + ey, 0, N - 1) * N + clamp(i + ex, 0, N - 1)]; } A[j * N + i] = s / 9; }
    var t = A; A = B; B = t;
  }
  for (j = 0; j < N; j++) for (i = 0; i < N; i++){
    var rx = (i + 0.5) / N * 2 - 1, ry = (j + 0.5) / N * 2 - 1, rt = Math.sqrt(rx * rx + ry * ry);
    var a = B[j * N + i] * (1 - sstep(0.70, 0.96, rt)), o2 = (j * N + i) * 4;
    if (a < 0.02){ d[o2] = mr; d[o2 + 1] = mg; d[o2 + 2] = mb; }
    d[o2 + 3] = Math.round(clamp(a, 0, 1) * 255);

}
function loadCompanion(done){
  fetch('companions.json').then(function(r){ return r.json(); }).then(function(list){
    var me = null; for (var i = 0; i < list.length; i++) if (list[i] && list[i].id === 'mira') me = list[i];
    if (!me || !me.dataUri) { done(); return; }
    var img = new Image();
    img.onload = function(){
      var mc = buildMatte(img);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, mc);
      gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      done();

    img.src = me.dataUri;

}

/* ---- capture real uniform states from the prototype (same origin), so the lab never drifts from nucleo-v2 ---- */
function capture(done){
  var fr = D.createElement('iframe'); fr.src = 'dist/nucleo-v2.html?t=2&freeze=1'; D.body.appendChild(fr);
  var tries = 0;
  function poll(){
    tries++;
    var w = fr.contentWindow, ok = false;
    try { ok = !!(w && w.nucleo && w.document.getElementById('gl')); } catch (e) { ok = false; }
    if (!ok){ if (tries > 80){ done(false); return; } setTimeout(poll, 100); return; }
    setTimeout(function(){
      try {
        var g = w.document.getElementById('gl').getContext('webgl'), p = g.getParameter(g.CURRENT_PROGRAM);
        var n = g.getProgramParameter(p, g.ACTIVE_UNIFORMS), names = [];
        for (var i = 0; i < n; i++){ var u = g.getActiveUniform(p, i); names.push([u.name.replace('[0]', ''), u.size]); }
        STATES.forEach(function(s){
          w.nucleo.seek(s.t); w.nucleo.render();
          var o = {};
          names.forEach(function(nm){
            if (nm[0] === 'uComp' || nm[0] === 'uC') return;
            if (nm[1] > 1){ var arr = []; for (var k = 0; k < nm[1]; k++) arr.push(Array.from(g.getUniform(p, g.getUniformLocation(p, nm[0] + '[' + k + ']')))); o[nm[0]] = arr; }
            else { var v = g.getUniform(p, g.getUniformLocation(p, nm[0])); o[nm[0]] = typeof v === 'number' ? v : Array.from(v); }
          });
          /* keep the relative size between states (idle r120 maps to R) */
          o.__rk = o.uR / (120 * g.canvas.width / 390);
          SNAP[s.id] = o;
        });
        done(true);
      } catch (e) { console.error('[GlassLab] capture', e); done(false); }
    }, 1200);
  }
  poll();
}

/* ---- bench: one sphere at the app's idle size on an iPhone-like backing store (r 120 x DPR 1.75) ---- */
function bench(size){
  size = size || 800; var c = D.createElement('canvas'); c.width = size; c.height = size;
  var g = c.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false });
  var out = ['bench: r = ' + Math.round(size * 0.2625) + ' px backing (800 = 120 CSS x DPR 1.75), ' + size + ' x ' + size + ' px, 200 draws each, readPixels sync every 20, best of 3 (lower is better)'];
  var buf = g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER, buf); g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), g.STATIC_DRAW);
  var snap = SNAP.idle || FALLBACK;
  var saveGl = gl; gl = g;
  var res = [];
  for (var rep = 0; rep < 3; rep++){
    VARIANTS.forEach(function(v, vi){
      var r = applyPatches(BASE_FS, v.v2), p;
      try { p = mkProg(g, r.src, v.id); } catch (e) { out.push(v.id + ' compile fail'); return; }
      g.useProgram(p); var al = g.getAttribLocation(p, 'a'); g.enableVertexAttribArray(al); g.vertexAttribPointer(al, 2, g.FLOAT, false, 0, 0);
      Object.keys(snap).forEach(function(k){ setU(p, k, snap[k]); });
      setU(p, 'uC', [size / 2, size / 2]); setU(p, 'uR', size * 0.2625);
      g.viewport(0, 0, size, size); g.enable(g.SCISSOR_TEST); g.scissor(0, 0, size, size);
      var px1 = new Uint8Array(4);
      for (var w = 0; w < 10; w++) g.drawArrays(g.TRIANGLES, 0, 3);
      g.readPixels(size >> 1, size >> 1, 1, 1, g.RGBA, g.UNSIGNED_BYTE, px1);
      var t = performance.now();
      for (var i = 0; i < 200; i++){ g.drawArrays(g.TRIANGLES, 0, 3); if (i % 20 === 19) g.readPixels(size >> 1, size >> 1, 1, 1, g.RGBA, g.UNSIGNED_BYTE, px1); }
      g.readPixels(size >> 1, size >> 1, 1, 1, g.RGBA, g.UNSIGNED_BYTE, px1);
      var ms = (performance.now() - t) / 200;
      res[vi] = Math.min(res[vi] || 1e9, ms);
      g.deleteProgram(p);
    });
  }
  VARIANTS.forEach(function(v, vi){ out.push(v.id + '  ' + (res[vi] != null ? res[vi].toFixed(3) + ' ms/draw' : 'n/a') + (vi ? '  (' + (res[vi] / res[0] * 100 - 100).toFixed(0) + '% vs current)' : '')); });
  gl = saveGl;
  $('bench').textContent = out.join('\n');
  W.__bench = res;
  return res;
}

buildBar();
layout();
if (initGL()){
  var pending = 2;
  function ready(){
    if (--pending) return;
    cells.forEach(function(c){ ambCss(c, SNAP[c.s.id] || FALLBACK); });
    draw();
    /* live colour metrics inside the glass (0.9r disc): OKLab chroma and the share of low-chroma mid-tones ("mud") */
    try { var m = chroma(0.9); cells.forEach(function(c, i){ var l = D.createElement('div'); l.className = 'lab'; l.style.bottom = '6px'; l.innerHTML = '<i>chroma ' + m[i].meanChroma.toFixed(3) + ' · mud ' + Math.round(m[i].mudShare * 100) + '%</i>'; c.el.appendChild(l); }); } catch (e) {}
    if (!ANIM) draw();
    W.__labReady = true;
  }
  capture(function(ok){
    if (!ok){ SNAP.idle = FALLBACK; msg('Prototype not reachable: showing the embedded idle state only.'); }
    else if (!(W.__labErrors || []).length) msg('States captured live from dist/nucleo-v2.html. Onboarding patches compile: ' + (VARIANTS.length) + '/' + VARIANTS.length + '.');
    ready();

}
function relL(r, g, b){ function li(c){ c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); } return 0.2126 * li(r) + 0.7152 * li(g) + 0.0722 * li(b); }
/* composite over the cell backdrop is approximated by the ambient centre colour (the glass interior is opaque, alpha 1) */
function probe(k, ox, oy){
  draw();
  return cells.map(function(c){
    var cx = Math.round((c.cx + (ox || 0) * R) * dpr), cy = Math.round(gl.canvas.height - (c.cy - (oy || 0) * R) * dpr), rad = Math.round((k || 0.3) * R * dpr);
    var w = rad * 2 + 1, px = new Uint8Array(w * w * 4);
    gl.readPixels(cx - rad, cy - rad, w, w, gl.RGBA, gl.UNSIGNED_BYTE, px);
    var sum = 0, n = 0, mx = 0, sr = 0, sg = 0, sb = 0;
    for (var j = 0; j < w; j++) for (var i = 0; i < w; i++){ var dx = i - rad, dy = j - rad; if (dx * dx + dy * dy > rad * rad) continue; var o = (j * w + i) * 4; var L = relL(px[o], px[o + 1], px[o + 2]); sum += L; n++; if (L > mx) mx = L; sr += px[o]; sg += px[o + 1]; sb += px[o + 2]; }
    return { v: c.v.id, s: c.s.name, meanL: +(sum / n).toFixed(4), maxL: +mx.toFixed(4), rgb: [Math.round(sr / n), Math.round(sg / n), Math.round(sb / n)] };
  });
}
function chroma(k){

  draw();
  function lin(c){ c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  return cells.map(function(c){
    var cx = Math.round(c.cx * dpr), cy = Math.round(gl.canvas.height - c.cy * dpr), rad = Math.round((k || 0.9) * R * dpr);
    var w = rad * 2 + 1, px = new Uint8Array(w * w * 4);
    gl.readPixels(cx - rad, cy - rad, w, w, gl.RGBA, gl.UNSIGNED_BYTE, px);
    var n = 0, cs = 0, mud = 0, Ls = 0;
    for (var j = 0; j < w; j += 2) for (var i = 0; i < w; i += 2){ var dx = i - rad, dy = j - rad; if (dx * dx + dy * dy > rad * rad) continue; var o = (j * w + i) * 4;
      var r = lin(px[o]), g = lin(px[o + 1]), b = lin(px[o + 2]);
      var l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s2 = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
      var L = 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s2, A = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s2, B = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s2;
      var C = Math.sqrt(A * A + B * B); cs += C; Ls += L; n++; if (L > 0.30 && L < 0.75 && C < 0.06) mud++; }
    return { v: c.v.id, s: c.s.name, meanChroma: +(cs / n).toFixed(4), meanL: +(Ls / n).toFixed(3), mudShare: +(mud / n).toFixed(3) };
  });
}
W.lab = { draw: function(){ draw(); }, bench: bench, snaps: function(){ return SNAP; }, probe: probe, chroma: chroma };
})();
