<meta charset="utf-8">
<title>Bobby Núcleo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: dark;
  --ground:#0B0A09; --ground-2:#131012; --raise:#1A1618; --rule:#2A2426;
  --ivory:#F2EDE4; --soft:#BDB5AA; --muted:#7F776D;
  --mint:#3FE0B5; --coral:#FF7A66; --amber:#F2B45A;
  --serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans:"Geist", "SF Pro Text", system-ui, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html,body{background:var(--ground);color:var(--ivory)}
body{font-family:var(--sans);font-size:15px;line-height:1.55;padding-inline:clamp(16px,4vw,48px);padding-block:44px 88px;background:radial-gradient(1200px 700px at 50% 0%,#1b1419 0%,var(--ground) 60%) var(--ground)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:64px}
header{display:grid;gap:16px;max-width:780px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,9vw,104px);line-height:.92;letter-spacing:-.01em;margin:0}
h1 em{font-style:italic;color:var(--amber)}
.lede{color:var(--soft);font-size:17px;max-width:62ch;margin:0;text-wrap:pretty}
.stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr;max-width:440px;margin:0 auto;width:100%}}
.demo{display:flex;flex-direction:column;gap:14px}
.demo-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.demo-head h2{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1;margin:0}
.demo-head span{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.demo p.what{margin:0;color:var(--soft);max-width:52ch}
.phone{position:relative;width:100%;max-width:380px;margin:4px auto 0;aspect-ratio:390/844;border-radius:50px;background:#000;padding:10px;box-shadow:0 0 0 1px #2E2729,0 40px 90px -40px #000,0 0 140px -70px var(--amber)}
.screen{position:relative;width:100%;height:100%;border-radius:41px;overflow:hidden;background:#050404}
.screen iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform-origin:0 0}
.notch{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:31%;height:30px;border-radius:20px;background:#000;z-index:2;pointer-events:none}
.step{font-family:var(--mono);font-size:12px;color:var(--soft);min-height:18px;text-align:center}
.step b{color:var(--ivory);font-weight:500}
.bar{height:2px;border-radius:2px;background:var(--rule);overflow:hidden;max-width:240px;margin:0 auto;width:100%}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--amber),var(--coral));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.controls{display:flex;gap:10px;justify-content:center}
button{font:500 13px var(--sans);color:var(--ivory);background:var(--raise);border:1px solid var(--rule);border-radius:999px;padding:8px 16px;cursor:pointer}
button:hover{background:#221c1f;border-color:#3a3134}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
section h2.sec{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1;margin:0 0 20px}
.moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.move{background:var(--ground-2);border:1px solid var(--rule);border-radius:18px;padding:20px 22px;display:grid;gap:8px;align-content:start}
.move .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.move h3{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.1;margin:0}
.move p{margin:0;color:var(--soft);font-size:14px}
.system{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.system .box{border-top:1px solid var(--rule);padding-top:14px;display:grid;gap:10px;align-content:start}
.system h3{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}
.system ul{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--soft);font-size:14px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:grid;gap:4px;font-family:var(--mono);font-size:10px;color:var(--muted);width:64px}
.sw i{display:block;height:40px;border-radius:10px;border:1px solid #ffffff1a}
.checklist{columns:2 320px;column-gap:32px;margin:0;padding-left:18px;color:var(--soft);font-size:14px}
.checklist li{break-inside:avoid;margin-bottom:8px}
.open{background:var(--ground-2);border:1px solid var(--rule);border-radius:18px;padding:22px 24px;display:grid;gap:10px;max-width:820px}
.open p{margin:0;color:var(--soft)}
.open strong{color:var(--ivory);font-weight:600}
footer{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Bobby · Núcleo v2</div>
    <h1>Núcleo, <em>afinado</em></h1>
    <p class="lede" id="lede"></p>
  </header>

  <section class="stage" id="stage">
    <article class="demo" data-src="nucleo-onboarding.html">
      <div class="demo-head"><h2>Primera vez</h2><span>ONBOARDING</span></div>
      <p class="what" id="what-onboarding"></p>
      <div class="phone"><div class="screen"><div class="notch"></div><iframe title="Onboarding de Núcleo" src="nucleo-onboarding.html"></iframe></div></div>
      <div class="step"><span>cargando…</span></div><div class="bar"><i></i></div>
      <div class="controls"><button type="button" data-act="next">Siguiente</button><button type="button" data-act="restart">Reiniciar</button></div>
    </article>
    <article class="demo" data-src="nucleo-v2.html">
      <div class="demo-head"><h2>Todos los días</h2><span>CICLO PRINCIPAL</span></div>
      <p class="what" id="what-core"></p>
      <div class="phone"><div class="screen"><div class="notch"></div><iframe title="Ciclo principal de Núcleo" src="nucleo-v2.html"></iframe></div></div>
      <div class="step"><span>cargando…</span></div><div class="bar"><i></i></div>
      <div class="controls"><button type="button" data-act="next">Siguiente</button><button type="button" data-act="restart">Reiniciar</button></div>
    </article>
  </section>

  <section id="moves-sec"><h2 class="sec">Qué subió de nivel</h2><div class="moves" id="moves"></div></section>
  <section id="system-sec"><h2 class="sec">El sistema</h2><div class="system" id="system"></div></section>
  <section id="details-sec"><h2 class="sec">Detalles finos</h2><ol class="checklist" id="details"></ol></section>
  <section id="open-sec"><div class="open" id="open"></div></section>
  <footer>Prototipos con datos de ejemplo (NVDA). Compañeros reales del Squad. No son pantallas de producción.</footer>
</div>

<script id="content" type="application/json">{"lede": "Núcleo llevado al siguiente nivel. Cuatro críticos revisaron la v1 (movimiento, composición, onboarding y detalle fino), un director escribió el sistema completo y dos constructores lo hicieron realidad; dos revisores adversariales corrigieron 37 detalles más. Ahora son dos prototipos: la primera vez que alguien abre Bobby y el uso de todos los días. Toca la pantalla para ir en cámara lenta; «Siguiente» salta de momento.", "whatOnboarding": "65.8 s. De un punto de luz al primer veredicto. Eliges a tu compañero dentro de la esfera, aprendes a preguntar manteniendo presionado, aceptas el aviso llenando el mismo anillo que después mide la convicción, y la cuenta se pide solo después de guardar tu primera tesis.", "whatCore": "43 s. El uso diario: preguntas, las tres voces pelean dentro del vidrio, los datos salen como satélites, la gráfica se exhala, «Wait» se condensa, jalas las tarjetas, guardas la tesis y recorres las caras de la esfera hasta volver al inicio.", "moves": [{"k": "El momento de marca", "t": "El duelo y el colapso", "d": "Alpha Hunter y Red Team son nodos visibles con un hilo a su etiqueta; se cruzan cada vez más rápido (1.9 s → 1.2 s) y cada choque saca una chispa. El primer impacto deja el vidrio perla, no ámbar: el ámbar inunda la esfera solo en el segundo impacto, en el mismo cuadro en que se dice «wait». Son 6 segundos pensados para ser el clip de 3 s de TikTok y App Store."}, {"k": "Movimiento", "t": "Física, no líneas de tiempo", "d": "Nueve resortes con nombre mueven todo (posiciones, radios y el shader). Cada movimiento grande de la esfera tiene 120 ms de anticipación, los gestos siguen al dedo 1:1 y heredan su velocidad, y un solo reloj de respiración de 4.8 s sincroniza la esfera, la píldora, el pulso del precio y la deriva de los satélites."}, {"k": "Continuidad", "t": "Todo nace y todo regresa", "d": "Tu pregunta entra a la esfera como una perla por el borde de abajo. Los satélites salen empujando el vidrio (un menisco) y regresan en orden inverso antes del veredicto. La tesis guardada se traga y reaparece en el inicio como satélite fantasma: «NVDA · Watching $168–172»."}, {"k": "Compañeros", "t": "Tu compañero vive adentro", "d": "Los 18 compañeros reales del Squad, recortados con un relleno desde el borde (se probó en los 18; la llave por luminancia borraba a 8 de ellos). Aparecen en el selector del onboarding, completos en la cara Squad y como silueta mientras Bobby habla. Su tinte se mezcla en OKLab y se apaga durante cada lectura para no competir con los tres colores de los agentes."}, {"k": "Onboarding", "t": "Valor antes que cuenta", "d": "Con 9 descargas y 0 registros, la cuenta ya no es un muro: aparece solo después de guardar la primera tesis, vertida desde la base de la esfera (Apple, Google, «Not now» sin perder nada). El permiso del micrófono llega cuando mantienes presionado por primera vez, y el aviso de riesgo es un «hold to agree» tranquilo."}, {"k": "Composición y tipo", "t": "Reglas que se ven", "d": "Bobby habla en serif (Instrument Serif), tú escribes en Geist y los datos van en Geist tabular. Nada de texto bajo 11 px, nada en la zona del notch, una sola luz focal por estado y el veredicto a 15.7:1 de contraste sobre su fondo. Menta, coral y ámbar quedan reservados para Alpha, Red Team y el CIO."}, {"k": "Material", "t": "Vidrio de verdad", "d": "Borde trasero, dispersión cromática, un brillo especular fijo aunque la esfera gire, piso interior elevado, grano y dither contra el banding, y un velo oscuro detrás de «Wait» para que se lea perfecto. El giro del interior ya no se acelera en cada vuelta (bug de la v1)."}], "system": [{"t": "Color", "swatches": [{"name": "Fondo", "hex": "#0B0A09"}, {"name": "Tinta", "hex": "#F2EDE4"}, {"name": "Alpha / Ready", "hex": "#3FE0B5"}, {"name": "Red / Pass", "hex": "#FF5A5F"}, {"name": "CIO / Wait", "hex": "#F6B94E"}, {"name": "Perla", "hex": "#E8DFD0"}, {"name": "Escucha", "hex": "#5CE1FF"}]}, {"t": "Resortes", "items": ["snap · presiones y cambios de texto, sin rebote", "soft · esfera y contenedores", "emit · todo lo que nace (satélites, chips, XP), 6.7% de rebote", "return · todo lo que vuelve a la esfera, nunca se pasa", "glide · caras, carrusel y selector, con la velocidad del dedo", "gulp · tragos y sacudidas del radio (26%)", "gaze · la esfera voltea hacia la píldora o el dedo", "birth · el nacimiento en el onboarding (2 → 126 → 120 px)"]}, {"t": "Tipografía y veredictos", "items": ["Instrument Serif: lo que dice Bobby, el saludo y el veredicto", "Geist: lo que dices tú y la interfaz", "Geist Mono tabular: números, ejes y etiquetas", "Piso de 11 px (solo los ticks de la gráfica van a 10)", "Veredictos: Ready (menta), Wait (ámbar), Pass (coral). «Buy» y «Sell» nunca aparecen"]}], "details": ["Los dígitos ruedan como odómetro (22 ms por dígito) y solo ruedan los que cambian.", "Los subtítulos avanzan con un barrido de 3 palabras: la palabra actual brilla y las siguientes esperan desenfocadas.", "La transcripción llega a ritmo de habla real, no de metrónomo.", "Las 22 barras de voz crecen desde el centro y colapsan en el mismo cuadro en que sueltas el dedo; adentro de la píldora hay tres gotas líquidas.", "La pregunta se escribe en el encabezado a 10 ms por letra, y la × mide 44 × 44 px.", "Hilos de 0.5 px unen cada etiqueta de agente con su punto de entrada en el borde.", "La onda del impacto llega a 1.05r en 180 ms y la sigue un silencio de 180 ms.", "El cometa de la gráfica no se frena al tocar la línea; su cabeza se convierte en el punto NOW.", "El corchete «+6.40» se enciende justo en la palabra «six».", "«Wait» se condensa 30 ms antes de que se diga, y la palabra del subtítulo se vuelve ámbar en ese mismo cuadro.", "El anillo de convicción llena 0 → 64% en 1.1 s, sin rebote, con un punto al frente y un destello al llegar.", "Jalar funciona desde cualquier parte; la esfera se estira como gota y se traga de vuelta.", "Guardar: presión → cambio de texto → un barrido ámbar del borde → chip de XP → la esfera se traga la tesis.", "Las caras giran exactamente una vuelta completa hasta regresar al Desk, y el brillo especular no se mueve.", "El nacimiento empieza en un punto de 4 px idéntico a la pantalla de arranque de iOS.", "El permiso del micrófono dice «Continue», nunca «Allow», y no tiene «Not now».", "Soltar antes de tiempo en el aviso de riesgo desenrolla el anillo en 300 ms, sin mensaje de error.", "Con movimiento reducido: nada dura más de 300 ms, no hay viajes, ni cometa, ni tragos."], "open": ["<strong>Una decisión que tomó el director y necesita tu sí:<\/strong> los veredictos ahora son Ready / Wait / Pass, nunca Buy / Sell. Protege a Bobby ante App Review (no suena a asesoría financiera) y encaja con «Think Before You Trade».", "<strong>Lo que todavía no está:<\/strong> medir 60 fps reales en un iPhone (el panel de preview corre a 2 fps); el «temperamento» de cada compañero (el zorro más preciso, Momo más elástico) está especificado pero no implementado; y el vidrio en reposo todavía se ve un poco «planeta marmoleado», que conviene afinar en los dos archivos a la vez.", "<strong>Siguiente paso si te late:<\/strong> construirlo en la web en una ruta aparte (/desk-v2) con el debate real y los compañeros reales del usuario, sin tocar la versión actual, y después iOS con el mismo shader portado a Metal."]}</script>
<script>
(function(){
  var c={};try{c=JSON.parse(document.getElementById('content').textContent)}catch(e){}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}
  function set(id,html){var el=document.getElementById(id);if(el)el.innerHTML=html}
  set('lede',esc(c.lede||''));
  set('what-onboarding',esc(c.whatOnboarding||''));
  set('what-core',esc(c.whatCore||''));
  set('moves',(c.moves||[]).map(function(m){return '<div class="move"><span class="k">'+esc(m.k)+'</span><h3>'+esc(m.t)+'</h3><p>'+esc(m.d)+'</p></div>'}).join(''));
  set('system',(c.system||[]).map(function(b){return '<div class="box"><h3>'+esc(b.t)+'</h3>'+(b.swatches?'<div class="swatches">'+b.swatches.map(function(s){return '<div class="sw"><i style="background:'+esc(s.hex)+'"></i>'+esc(s.name)+'<br>'+esc(s.hex)+'</div>'}).join('')+'</div>':'')+(b.items?'<ul>'+b.items.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul>':'')+'</div>'}).join(''));
  set('details',(c.details||[]).map(function(d){return '<li>'+esc(d)+'</li>'}).join(''));
  set('open',(c.open||[]).map(function(p){return '<p>'+p+'</p>'}).join(''));
  ['moves','system','details','open'].forEach(function(k){if(!(c[k]&&c[k].length)){var s=document.getElementById(k+'-sec');if(s)s.hidden=true}});
  var demos=[].slice.call(document.querySelectorAll('.demo'));
  demos.forEach(function(d){
    var iframe=d.querySelector('iframe'),screen=d.querySelector('.screen');
    function fit(){iframe.style.transform='scale('+(screen.clientWidth/390)+')'}
    try{new ResizeObserver(fit).observe(screen)}catch(e){window.addEventListener('resize',fit)}fit();
    d.querySelector('[data-act=next]').addEventListener('click',function(){try{iframe.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight'}))}catch(e){}});
    d.querySelector('[data-act=restart]').addEventListener('click',function(){iframe.src=d.getAttribute('data-src')});
  });
  window.addEventListener('message',function(ev){
    var m=ev.data;if(!m||m.type!=='bobby-step')return;
    demos.forEach(function(d){var f=d.querySelector('iframe');if(f.contentWindow===ev.source){d.querySelector('.step span').innerHTML='<b>'+esc((m.index+1)+'/'+m.total)+'</b> · '+esc(m.title);d.querySelector('.bar i').style.width=(100*(m.index+1)/Math.max(1,m.total))+'%'}});
  });
})();
</script>
