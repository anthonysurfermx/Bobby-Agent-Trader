#pauseTag{left:159px;top:806px;width:72px;height:24px;border-radius:12px;background:rgba(242,237,228,.10);border:.5px solid var(--line);

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* typing: a real textarea OUTSIDE the scaled stage (the keyboard lifts it with visualViewport) */
#typeBox{position:fixed;left:16px;right:16px;top:0;z-index:20;display:none;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px;border-radius:26px;
  background:rgba(22,19,17,.94);border:.5px solid rgba(242,237,228,.16);box-shadow:0 20px 50px -18px rgba(0,0,0,.9);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);touch-action:auto;opacity:0;transform:translateY(20px)}
#typeBox.on{display:flex}
#typeIn{flex:1;min-height:36px;max-height:120px;resize:none;border:0;outline:0;background:transparent;color:#F2EDE4;font:400 17px/22px 'Geist',-apple-system,system-ui,sans-serif;
  padding:7px 0;-webkit-user-select:text;user-select:text;touch-action:auto;caret-color:#FFF8EC}
#typeIn::placeholder{color:#8A8378}
#typeSend{flex:none;width:40px;height:40px;border-radius:20px;background:#F2EDE4;color:#141210;display:grid;place-items:center;touch-action:manipulation}

/* Núcleo bridge client, protocol v1 (ARCHITECTURE.md §2).
 * The ONLY path from page JS to native. The page never fetches the network:
 * the CSP has connect-src 'none', and the API rejects the file:// origin anyway.
 *
 *   nucleoBridge.call(method, params)  -> Promise<result>   (JS -> native, request/response)
 *   nucleoBridge.on(event, fn)          -> unsubscribe fn    (native -> JS events)
 *   nucleoBridge.emit(event, payload)                         (called BY native via callAsyncJavaScript)
 *
 * Replies: native answers every envelope with {v:1, ok:true, result} or
 * {v:1, ok:false, error:{code, message}}. Domain outcomes (quota, unknown
 * asset, cancelled...) are ok:true results with a `status`; ok:false is only

  if (k === 'tap' || k === 'hold'){ xy = targetXY(a[1], -1); H.g = { kind:'press', name:a[1], idx:-1, x:xy[0], y:xy[1], t1:T + (k === 'tap' ? 0.1 : a[2]), down:false }; }
  else if (k === 'chip'){ xy = targetXY('chip', a[1]); H.g = { kind:'press', name:'chip', idx:a[1], x:xy[0], y:xy[1], t1:T + 0.1, down:false }; }
  else if (k === 'swipe'){ var x0 = a[1] < 0 ? 240 : 150; H.g = { kind:'drag', x0:x0, y0:330, x1:x0 + (a[1] < 0 ? -90 : 90), y1:330, t0:T, dur:0.3, down:false }; }
  else if (k === 'pull'){ H.g = { kind:'drag', x0:195, y0:530, x1:195, y1:530 + a[1], t0:T, dur:0.5, down:false }; }
  else if (k === 'type'){ typeIn.value = a[1]; typeSubmit(); }
}

function togglePause(){ paused = !paused; st($('pauseTag'), null, paused ? 1 : 0); }
/* fonts and companion mattes settle before a scripted run starts, so text layout and textures never race the seek */
function harnessPrepare(){
  H.name = Q.script || ''; H.script = SCRIPTS[H.name] || null;
  var fonts = [];
  try { ['400 26px "Instrument Serif"', '400 40px "Instrument Serif"', '400 15px Geist', '500 15px Geist', '600 16px Geist', '500 11px "Geist Mono"', '400 10px "Geist Mono"'].forEach(function(f){ fonts.push(document.fonts.load(f)); }); } catch(e){}
  var timeout = new Promise(function(res){ setTimeout(res, 4000); });
  var mattes = loadRoster().then(function(){
    return new Promise(function(res){ var t0 = Date.now(); (function poll(){ if (MATTE_PENDING <= 0 || Date.now() - t0 > 4000) res(); else setTimeout(poll, 30); })(); });
  }, noop);
  return Promise.race([Promise.all(fonts.concat([mattes])), timeout]).then(function(){ capEls.forEach(function(c){ c._h = 0; }); wmEl._w = 0; });

function flush(){ var p = Promise.resolve(); for (var i = 0; i < 12; i++) p = p.then(noop); return p; }
/* replay to t in fixed steps; bridge replies (microtasks) are flushed after every step */
function runTo(t){
  SEEKING = true;
  return new Promise(function(done){
    (function chunk(){
      var n = 0;
      (function loop(){
        if (T + STEP > t + 1e-9 || n > 240){ if (T + STEP > t + 1e-9){ SEEKING = false; renderAll(); done(T); } else setTimeout(chunk, 0); return; }
        sim(STEP); n++;
        flush().then(loop);
      })();
    })();
  });
}
/* FNV-1a over the GL pixels, the snow canvas and every VISIBLE stage element's transform/opacity/filter/text
   (an element at opacity 0 keeps whatever transform it last had; it is not part of the frame) */
function hashFrame(parts){
  renderAll();
  var h = 2166136261 >>> 0, hg = 0;
  function mix(v){ h ^= v & 255; h = Math.imul(h, 16777619) >>> 0; }
  function mixS(s){ for (var i = 0; i < s.length; i++) mix(s.charCodeAt(i)); }
  if (gl){ var w = cv.width, hh = cv.height, px = new Uint8Array(w * hh * 4); gl.readPixels(0, 0, w, hh, gl.RGBA, gl.UNSIGNED_BYTE, px); for (var i = 0; i < px.length; i += 16) mix(px[i] ^ (px[i + 1] << 1) ^ (px[i + 2] << 2) ^ px[i + 3]); }
  if (snowCv._drawn){ try { var sd = snowX.getImageData(0, 0, snowCv.width, snowCv.height).data; for (var q = 3; q < sd.length; q += 64) mix(sd[q]); } catch(e){} }
  hg = h; h = 2166136261 >>> 0;
  (function walk(el){
    for (var c = el.firstElementChild; c; c = c.nextElementSibling){
      var s = c.style; if (!s) continue;
      if (s.opacity === '0' || s.visibility === 'hidden' || s.display === 'none' || c.getAttribute('opacity') === '0') continue;   /* SVG groups hide by attribute */
      mixS((c.id || c.tagName) + '|' + s.transform + '|' + s.opacity + '|' + s.filter + '|' + (s.clipPath || '') + '|' + (c.firstElementChild ? '' : c.textContent));
      walk(c);
    }
  })(stage);
  var g = ('00000000' + hg.toString(16)).slice(-8), d = ('00000000' + h.toString(16)).slice(-8);
  return parts ? { gl:g, dom:d } : g + d;
}

/* ---- onboarding/99-boot.js ---- */

/* ============================================================
   Loop + boot. The first bridge call is session({page}); nothing
   else is asked of native before it answers.
   ============================================================ */
function renderAll(){
  renderSphere(); renderSnow(); renderSats(); renderRing(); renderVerdict(); renderChart();
  renderBelt(); renderIsla(); renderMeridian(); renderQuestion(); renderAgents();
  renderCaptions(); renderTexts(); renderPicker(); renderLines(); renderHint();
  renderPill(); renderChips(); renderPerm(); renderCards(); renderSheet(); renderGsat();
  renderGhost(); renderTyping();
}
var STEP = 1 / 120, last = 0, BOOTED = false;
function advance(dt){ var acc = dt; while (acc > 1e-9){ var h = Math.min(STEP, acc); sim(h); acc -= h; } }
/* visibility: nothing is drawn while hidden or while a native sheet covers the page; the clock slows to 0.15× */
var onScreen = true;
try { new IntersectionObserver(function(es){ var v = es[es.length - 1].isIntersecting; if (v !== onScreen){ onScreen = v; last = performance.now(); qReset(); } }, { threshold:0 }).observe(gl ? cv : stage); } catch(e){}
function visible(){ return !document.hidden && onScreen; }

/* ?fps=1: a tiny meter (debug only): fps over the last 1 s, frame interval p50/p95, JS work per frame, quality tier */
var FPS = Q.fps === '1', fpsEl = null, fT = new Float64Array(240), fD = new Float32Array(240), fW = new Float32Array(240), fS = new Float32Array(240), fI = 0, fN = 0, fLast = 0;

function fpsFrame(now, ms, work){
  fT[fI] = now; fD[fI] = ms; fW[fI] = work; fI = (fI + 1) % 240; if (fN < 240) fN++;
  if (now - fLast < 250) return; fLast = now;
  var n = 0, ws = 0;
  for (var k = 1; k <= fN; k++){ var j = (fI - k + 240) % 240; if (now - fT[j] > 1000) break; fS[n++] = fD[j]; ws += fW[j]; }
  if (!n) return;
  for (var i = 1; i < n; i++){ var v = fS[i], q = i - 1; while (q >= 0 && fS[q] > v){ fS[q + 1] = fS[q]; q--; } fS[q + 1] = v; }
  var qt = QT[QI];
  txt(fpsEl, n + ' fps · ' + fS[n >> 1].toFixed(1) + '/' + fS[Math.min(n - 1, Math.floor(n * 0.95))].toFixed(1) + ' ms\nQ' + QI + (QPIN != null ? '*' : '') + ' ' + qt.dpr.toFixed(2) + 'x' + (qt.oct < 4 ? ' oct' + qt.oct : '') + (qt.disp ? '' : ' -disp') + (qCap ? ' cap ' + qCap.toFixed(0) : '') + ' · js ' + (ws / n).toFixed(2) + '\n' + W.state);
}
function frame(now){
  if (now - fitChk > 500){ fitChk = now; refit(); }
  var raw = Math.min(0.5, Math.max(0, (now - last) / 1000)); last = now;
  var vis = visible() && !W.sheetOpen;
  if (BOOTED && !frozen && !SEEKING) advance(raw * (paused || !vis ? 0.15 : 1));
  if (vis && !SEEKING){
    var w0 = performance.now(); try { renderAll(); } catch(e){ report('render', e); } var work = performance.now() - w0;
    if (!frozen) qSample(raw * 1000, raw);
    if (FPS) fpsFrame(now, raw * 1000, work);
  }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', function(){ last = performance.now(); qReset(); });
window.addEventListener('pageshow', function(){ last = performance.now(); qReset(); });
if (HARNESS){

    else if (e.key === 'ArrowLeft'){ var pv = HERO.filter(function(x){ return x.t < T - 0.5; }).pop(); reloadAt(pv ? pv.t : 0); e.preventDefault(); }

}
/* hero frames of the current scripted run (state/signal + dwell), for ArrowRight/Left and the report */
var HERO_DEF = [['born', 'BIRTH', 2.6], ['picker', 'PICK_READY', 1.0], ['mic card', 'PRE_PERMISSION', 0.9], ['listening', 'LISTENING', 1.8],
  ['risk ring filling', 'AGREE_READY', 2.9], ['debate', 'THINK_WAIT', 3.0], ['stances', 'THINK_RESOLVE', 1.9], ['satellites', 'TALK_EVIDENCE', 1.6],
