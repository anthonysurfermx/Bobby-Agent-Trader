<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0A09">
<title>Bobby</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A09; --ink:#F2EDE4; --inkb:#FFF8EC; --ink2:#A39C91; --ink3:#8A8378; --ink4:rgba(242,237,228,.28);
  --hair:rgba(242,237,228,.08); --line:rgba(242,237,228,.12);
  --alpha:#3FE0B5; --red:#FF5A5F; --cio:#F6B94E; --pearl:#E8DFD0; --listen:#5CE1FF;
  --glass:rgba(22,19,17,.86);
  --serif:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#0B0A09;overscroll-behavior:none;
  touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#stage{position:absolute;left:0;top:0;width:390px;height:844px;overflow:hidden;transform-origin:0 0;background:#0B0A09;
  color:var(--ink);font-family:var(--sans);font-variant-numeric:tabular-nums lining-nums;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#amb{position:absolute;left:0;top:0;width:390px;height:650px;z-index:0;pointer-events:none;--amb:#15121C;
  background:radial-gradient(351px 464.2px at 195px 325px,var(--amb) 0%,#0B0A09 70%)}
#fpsM{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top, 0px));z-index:20;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.62);border:.5px solid rgba(242,237,228,.14);
  font:500 11px/14px var(--mono);color:#F2EDE4;white-space:pre;text-align:right;pointer-events:none;font-variant-numeric:tabular-nums}
.a{position:absolute;left:0;top:0}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;border:0;background:none}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

#pool{position:absolute;left:0;top:0;width:204px;height:38.4px;border-radius:50%;filter:blur(18px);z-index:0;pointer-events:none;transform-origin:0 0}
#gl{position:absolute;left:0;top:0;width:390px;height:844px;z-index:0}
#fallback{display:none;position:absolute;left:0;top:0;width:100px;height:100px;border-radius:50%;overflow:hidden;z-index:0;transform-origin:0 0;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.85) 0 3%,rgba(255,255,255,0) 12%),radial-gradient(circle at 30% 72%,rgba(255,110,199,.7),rgba(255,110,199,0) 48%),radial-gradient(circle at 72% 34%,rgba(92,225,255,.6),rgba(92,225,255,0) 46%),radial-gradient(circle at 56% 60%,rgba(154,92,255,.8),rgba(154,92,255,0) 63%),#0c0b16;
  box-shadow:0 0 60px rgba(130,120,255,.28),inset 0 0 22px rgba(255,255,255,.25)}
#fallback img{position:absolute;left:15%;top:18%;width:70%;height:70%;opacity:.55;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(circle,#000 42%,transparent 70%);mask-image:radial-gradient(circle,#000 42%,transparent 70%)}
.nogl #fallback{display:block}.nogl #gl{display:none}
#grain{position:absolute;left:0;top:0;width:390px;height:844px;z-index:1;pointer-events:none;opacity:.035;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#lbx{position:absolute;left:0;top:0;width:390px;height:844px;z-index:1;pointer-events:none;display:none;
  --fx:linear-gradient(90deg,#0B0A09 0,rgba(11,10,9,.56) 8px,rgba(11,10,9,.25) 16px,rgba(11,10,9,.06) 24px,rgba(11,10,9,0) 32px,rgba(11,10,9,0) 358px,rgba(11,10,9,.06) 366px,rgba(11,10,9,.25) 374px,rgba(11,10,9,.56) 382px,#0B0A09 390px);
  --fy:linear-gradient(180deg,#0B0A09 0,rgba(11,10,9,.56) 8px,rgba(11,10,9,.25) 16px,rgba(11,10,9,.06) 24px,rgba(11,10,9,0) 32px,rgba(11,10,9,0) 812px,rgba(11,10,9,.06) 820px,rgba(11,10,9,.25) 828px,rgba(11,10,9,.56) 836px,#0B0A09 844px)}
.lbx-x #lbx,.lbx-y #lbx{display:block}
.lbx-x #lbx{background-image:var(--fx)}.lbx-y #lbx{background-image:var(--fy)}.lbx-x.lbx-y #lbx{background-image:var(--fx),var(--fy)}
#sphereA{position:absolute;left:0;top:0;width:240px;height:240px;border-radius:50%;z-index:2;transform-origin:0 0;pointer-events:none}

/* in-glass layer: glyphs that ride the surface */
#inGlass{position:absolute;left:0;top:0;width:390px;height:844px;z-index:2;pointer-events:none;mix-blend-mode:screen}
#islaG{position:absolute;left:0;top:0;width:120px;height:120px;overflow:visible;transform-origin:60px 60px}

#ui{position:absolute;left:0;top:0;width:390px;height:844px;z-index:3}
#vec,#chart{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

/* header */
#wm{left:12px;top:54px;height:44px;padding:0 8px;font:400 24px/44px var(--serif);letter-spacing:-.01em;white-space:nowrap;cursor:default}
#close{position:absolute;left:10px;top:54px;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--ink2);cursor:pointer}
#dockQ{left:75px;top:62px;width:240px;height:21px;font:400 15px/21px var(--sans);color:var(--ink2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#dockA{left:75px;top:84px;width:240px;height:14px;font:500 11px/14px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:center;white-space:nowrap;overflow:hidden;pointer-events:none}
#avatar{left:338px;top:60px;width:32px;height:32px;padding:0;cursor:pointer}
#avatar::before{content:'';position:absolute;left:-8px;top:-8px;width:48px;height:48px;border-radius:50%}   /* 48 px target around the 32 px face */
#avatar .ph{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;overflow:hidden;background:#232120;box-shadow:0 0 0 .5px rgba(242,237,228,.2)}
#avatar img{position:absolute;left:-9%;top:-4%;width:118%;height:118%;display:block}
#avatar .mg{position:absolute;inset:0;display:grid;place-items:center;font:400 17px/1 var(--serif);color:var(--ink)}
#avatar svg{position:absolute;left:-4px;top:-4px;width:40px;height:40px;overflow:visible}

/* greeting, notes, face text */
#greet,#note{left:20px;top:512px;width:350px;text-align:center;pointer-events:none}
#greet .t{font:400 40px/42px var(--serif);letter-spacing:-.015em;white-space:nowrap}
#greet .s{display:block;margin-top:12px;font:400 16px/23px var(--sans);color:var(--ink2);white-space:nowrap}
#note .t{font:400 26px/31px var(--serif);letter-spacing:-.005em;text-wrap:balance}
#note .s{display:block;margin-top:8px;font:400 15px/21px var(--sans);color:var(--ink2);text-wrap:balance}
.w{display:inline-block}
.ftx{left:20px;top:512px;width:350px;text-align:center;pointer-events:none}
.ftx .t{font:400 36px/40px var(--serif);letter-spacing:-.01em;white-space:nowrap}
.ftx .s{display:block;margin-top:6px;font:400 15px/21px var(--sans);color:var(--ink2);text-wrap:balance}
.ftx .cw{position:absolute;left:0;width:350px;top:94px;text-align:center}
.fchip{display:inline-block;height:40px;padding:0 16px;border-radius:20px;border:.5px solid var(--line);background:rgba(242,237,228,.04);font:500 15px/39px var(--sans);color:var(--ink);cursor:pointer;white-space:nowrap;pointer-events:auto}

/* meridian dots */
#meri{left:0;top:0;width:390px;height:844px;pointer-events:none}
#meri i{position:absolute;left:0;top:0;width:6px;height:6px;border-radius:3px;background:var(--ink4);transform-origin:50% 50%}
#meri b{position:absolute;left:0;top:0;width:4px;height:4px;border-radius:2px;background:var(--cio)}
#meriHit{position:absolute;left:115px;top:462px;width:160px;height:44px;border-radius:22px;cursor:pointer}

/* hint row */
#hint{left:0;top:713px;width:390px;height:14px;font:500 11px/14px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;text-align:center;pointer-events:none}
.roll span{position:absolute;left:0;right:0;top:0;white-space:nowrap}

/* pill */
#micGlow{left:60px;top:731px;width:270px;height:78px;border-radius:40px;overflow:hidden;pointer-events:none;transform-origin:135px 39px;filter:blur(22px)}
#micGlow i{position:absolute;left:-6px;top:-102px;width:282px;height:282px;transform-origin:141px 141px;
  background:conic-gradient(from 0deg,#4D6BFF,#9A5CFF,#FF6EC7,#5CE1FF,#4D6BFF)}
#pill{position:absolute;left:0;top:742px;width:96px;height:56px;border-radius:28px;background:#000;border:1px solid rgba(242,237,228,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 40px -14px rgba(0,0,0,.9);overflow:hidden;cursor:pointer;padding:0;transform-origin:50% 50%}
#pill > .c{position:absolute;left:50%;top:50%;pointer-events:none}
#pill .mic{width:22px;height:22px;margin:-11px 0 0 -11px}
#pill .kbd{width:24px;height:24px;margin:-12px 0 0 -12px}
#pill .bars{width:150px;height:32px;margin:-16px 0 0 -75px;display:flex;gap:4px;align-items:center;justify-content:center}
#pill .bars i{display:block;flex:0 0 3px;height:28px;border-radius:2px;background:var(--ink);transform:scaleY(.14)}
#pill .goo{width:236px;height:56px;margin:-28px 0 0 -118px;overflow:visible}
#pill .think{width:24px;height:24px;margin:-12px 0 0 -12px}
#pill .think i{position:absolute;left:9.5px;top:9.5px;width:5px;height:5px;border-radius:50%}
#pill .stop{width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:3px;background:var(--ink)}

/* transcript + bead */
#tx{left:20px;top:528px;width:350px;text-align:center;font:400 24px/30px var(--sans);letter-spacing:-.012em;text-wrap:balance;pointer-events:none}
#bead{width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#FFF8EC 45%,rgba(255,248,236,.6) 100%);box-shadow:0 0 0 .5px rgba(255,248,236,.5);pointer-events:none}

/* agents */
.ag{top:188px;width:156px;pointer-events:none}
.ag .nm{font:500 11px/14px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c);white-space:nowrap}
.ag .nm i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--c);vertical-align:1px}
.ag .st{position:relative;margin-top:4px;font:400 15px/21px var(--sans);color:var(--ink)}
#ag0{left:20px;text-align:left}#ag0 .nm i{margin-right:8px}#ag0 .st{padding-left:13px}
#ag1{left:214px;text-align:right}#ag1 .nm i{margin-left:8px}#ag1 .st{padding-right:13px}
#ag2{left:45px;width:300px;top:528px;text-align:center}
#ag2 .dt{display:block;width:5px;height:5px;border-radius:50%;background:var(--c);margin:0 auto 4px}
#ag2 .st{min-height:21px}
#ag2 .vf{position:absolute;left:0;right:0;top:0;height:21px;white-space:nowrap}

/* satellites */
.sat{min-width:100px;height:52px;border-radius:16px;padding:7px 12px 0;background:var(--glass);border:.5px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);white-space:nowrap;overflow:hidden;transform-origin:0 0;pointer-events:none}
.sat .k{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 11px/14px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.sat .k i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:6px;background:var(--c);vertical-align:1px}
.sat .k em{font:500 11px/14px var(--sans);letter-spacing:0;text-transform:none;font-style:normal;color:var(--ink2)}
.sat .k em .dl{display:inline-block;width:7px;height:6px;margin-right:2px;vertical-align:0}
.sat .v em.q{font:400 13px/22px var(--sans);letter-spacing:0;font-style:normal;color:var(--ink2);margin-left:4px}
.sat .v{margin-top:3px;height:22px;font:500 18px/22px var(--sans);letter-spacing:-.01em;color:var(--ink)}
.sat.tap{pointer-events:auto;cursor:pointer}
.dg{display:inline-block;height:22px;overflow:hidden;vertical-align:top}
.dg b{display:block;font-weight:inherit}
.dg b span{display:block;height:22px}

/* verdict */
#vWord{width:240px;text-align:center;font-family:var(--serif);font-weight:400;line-height:1;color:var(--inkb);white-space:nowrap;pointer-events:none}
#convL{font:500 11px/14px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,248,236,.74);white-space:nowrap;pointer-events:none}
#pct{width:48px;height:16px;text-align:right;font:600 13px/16px var(--sans);white-space:nowrap;pointer-events:none}
.col{display:inline-block;height:16px;overflow:hidden;vertical-align:top}
.col b{display:block;font-weight:inherit}
.col b span{display:block;height:16px}

/* captions */
.say,.sayM{left:20px;width:350px;text-align:center;font:400 26px/31px var(--serif);letter-spacing:-.005em;text-wrap:balance;transform-origin:175px 31px;pointer-events:none}
.sayM{visibility:hidden}
#meta{left:20px;width:350px;text-align:center;font:400 12px/16px var(--sans);color:var(--ink3);pointer-events:none}

/* cards */
.card{width:330px;height:360px;border-radius:28px;background:linear-gradient(180deg,rgba(34,30,27,.96),rgba(23,21,19,.96));border:.5px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden;transform-origin:165px 180px}
.card > .p{position:absolute;left:24px;right:24px}
.card .ch{top:24px;display:flex;justify-content:space-between;align-items:baseline}
.card .ch .lb{font:500 11px/14px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.card .ch .mt{font:400 13px/16px var(--sans);color:var(--ink2)}
.card .ct{top:48px;font:400 28px/31px var(--serif);letter-spacing:-.01em;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rows{top:91px}
.card .rows div{display:flex;justify-content:space-between;align-items:center;height:36px;border-bottom:.5px solid rgba(242,237,228,.06)}
.card .rows div:last-child{border-bottom:0}
.card dt{font:500 11px/14px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.card dd{font:500 17px/22px var(--sans);letter-spacing:-.005em;text-align:right}
.card .ln{font:400 13px/16px var(--sans);color:var(--ink2)}
.card .xp{right:auto;height:26px;padding:0 10px;border-radius:13px;font:500 13px/26px var(--sans);white-space:nowrap}
.card .hz{height:32px;display:flex;gap:2px;padding:2px;border-radius:16px;background:rgba(242,237,228,.05);border:.5px solid var(--hair)}
.card .hz button{flex:1;height:28px;border-radius:14px;font:500 13px/28px var(--sans);color:var(--ink2);cursor:pointer}
.card .hz button.on{background:rgba(242,237,228,.12);color:var(--ink)}
.card .save{top:284px;height:52px;border-radius:26px;background:var(--ink);color:#141210;cursor:pointer;overflow:hidden;padding:0;font:600 16px/20px var(--sans)}
.save .sw{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:26px;padding:1px;
  background:conic-gradient(from var(--sa,0deg),rgba(242,237,228,0) 0deg,rgba(242,237,228,0) 240deg,var(--sc,rgba(242,237,228,.95)) 330deg,rgba(242,237,228,0) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.save .roll{position:absolute;left:0;top:16px;right:0;height:20px;pointer-events:none}
.save .roll span{text-align:center}
.card .scr{top:62px;height:250px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent)}
.card .scr .in{position:absolute;left:0;right:0;top:0}
.card .ar{display:flex;gap:12px;margin-bottom:16px}
.card .ar i{flex:0 0 6px;height:6px;border-radius:50%;background:var(--c);margin-top:4px}
.card .ar b{display:block;font:500 11px/14px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.card .ar p{margin-top:4px;font:400 16px/23px var(--sans)}
.card .disc{top:322px;font:400 12px/16px var(--sans);color:var(--ink2)}
.card .bd{top:91px;font:400 16px/23px var(--sans);color:var(--ink2)}
.card .go{top:284px;height:52px;border-radius:26px;background:rgba(242,237,228,.08);border:.5px solid var(--line);color:var(--ink);font:600 16px/52px var(--sans);text-align:center;cursor:pointer}
#tpill{height:24px;padding:0 10px;border-radius:12px;font:500 11px/23px var(--mono);letter-spacing:.06em;text-align:center;white-space:nowrap;transform-origin:50% 50%;pointer-events:none}

/* chips */
#eyebrow{left:20px;top:613px;font:500 11px/14px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);white-space:nowrap;pointer-events:none}
#chipRow{left:0;top:0;width:390px;height:844px;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.chip{position:absolute;left:0;top:0;height:40px;padding:0 16px;border-radius:20px;border:.5px solid var(--line);background:rgba(242,237,228,.04);font:500 15px/39px var(--sans);color:var(--ink2);white-space:nowrap;cursor:pointer;pointer-events:auto;transform-origin:50% 50%}
.chip.first{color:var(--ink)}

/* pre-permission card: blooms from the bottom rim */
#perm{left:45px;top:488px;width:300px;border-radius:24px;padding:20px 20px 16px;background:var(--glass);border:.5px solid var(--hair);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 60px -24px rgba(0,0,0,.9);z-index:6;text-align:center}
#perm.set{background:rgba(22,19,17,.72);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#perm h4{font:400 24px/28px var(--serif);letter-spacing:-.01em;font-weight:400}
#perm p{font:400 15px/21px var(--sans);color:var(--ink2);margin-top:6px;text-wrap:balance}
#perm button{display:block;margin:14px auto 0;width:252px;height:44px;border-radius:22px;background:var(--ink);color:#141210;font:600 16px/44px var(--sans);cursor:pointer}

/* belt */
#belt{left:0;top:0;width:390px;height:844px;pointer-events:none}
#belt .bd{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;overflow:hidden;background:#232120;box-shadow:0 0 0 .5px rgba(242,237,228,.22);transform-origin:16px 16px}
#belt .bd img{position:absolute;left:-9%;top:-4%;width:118%;height:118%}
#belt .bd.on{box-shadow:0 0 0 1px rgba(242,237,228,.85)}
#belt .bd.lk img{opacity:.4}

/* harness only: ghost finger + pause tag */
#ghost{width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:1px solid rgba(242,237,228,.6);pointer-events:none;z-index:9}
#ghost .f{position:absolute;left:-1px;top:-1px;width:28px;height:28px;border-radius:50%;background:rgba(242,237,228,.12)}
#ghost .d{position:absolute;left:10px;top:10px;width:6px;height:6px;border-radius:50%;background:rgba(242,237,228,.8)}
#pauseTag{left:0;top:806px;width:390px;height:24px;text-align:center;pointer-events:none;z-index:10}
#pauseTag span{display:inline-block;height:24px;padding:0 10px;border-radius:12px;background:rgba(242,237,228,.08);border:.5px solid var(--line);font:500 11px/23px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}

/* typing: a real textarea OUTSIDE the scaled stage, lifted above the keyboard (visualViewport) */
#typeBox{position:fixed;left:0;top:0;z-index:40;visibility:hidden;opacity:0;border-radius:24px;background:#000;border:1px solid rgba(242,237,228,.12);

#ta::placeholder{color:#8A8378}
#taSend{position:absolute;right:7px;bottom:7px;width:36px;height:36px;border-radius:18px;background:#F2EDE4;color:#141210;display:grid;place-items:center;cursor:pointer}

/* Núcleo bridge client, protocol v1 (ARCHITECTURE.md §2).
 * The ONLY path from page JS to native. The page never fetches the network:
 * the CSP has connect-src 'none', and the API rejects the file:// origin anyway.
 *
 *   nucleoBridge.call(method, params)  -> Promise<result>   (JS -> native, request/response)
 *   nucleoBridge.on(event, fn)          -> unsubscribe fn    (native -> JS events)
 *   nucleoBridge.emit(event, payload)                         (called BY native via callAsyncJavaScript)
 *
 * Replies: native answers every envelope with {v:1, ok:true, result} or
 * {v:1, ok:false, error:{code, message}}. Domain outcomes (quota, unknown
 * asset, cancelled...) are ok:true results with a `status`; ok:false is only

function flush(){ var p = Promise.resolve(); for (var i = 0; i < 12; i++) p = p.then(noop); return p; }

function fnv(h, s){ for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
function fnvBytes(h, b){ for (var i = 0; i < b.length; i++){ h ^= b[i]; h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }

var HBUSY = false, FROZEN = false;
function harnessLoop(){
  var lastNow = -1;
  function tick(now){
    requestAnimationFrame(tick);
    if (HBUSY || FROZEN) return;
    if (!(active = canRun())){ lastNow = -1; return; }
    var raw = lastNow < 0 ? 0 : Math.min(0.5, Math.max(0, (now - lastNow) / 1000)); lastNow = now;

/* =====================================================================
   19. Boot: wire the bridge events, ask for the session, then wake.
   BOOT is black until session(); the page's first bridge call is session({page}).
   ===================================================================== */
function applySession(s, first){
  if (!s || typeof s !== 'object') return;
  var prevId = SES && SES.companion ? SES.companion.id : null;
  SES = s;
  SES.mic = SES.mic || { state: 'undetermined', onDevice: true };
  if (first){ LANG = s.language === 'es' ? 'es' : 'en'; D.documentElement.lang = LANG; if (s.reducedMotion) RM = true; }
  var c = s.companion || null, id = c ? c.id : null;
  if (first || id !== prevId){
    ME.id = id; ME.webId = c ? c.webId : null; ME.art = c ? artFor(c.webId) : null; ME.label = c ? titleCase(c.label) : '';
    ME.pal = c && GLASS[c.palette] ? c.palette : 'ghost'; ME.tint = hex(GLASS[ME.pal]); ME.cap = ME.pal === 'lava' ? 0.28 : 0.35;
    TM = temper(ME.pal); applyTemperSprings(); if (U) tuneAmbient(false);
    buildAvatar(); loadCompanionArt();
    if (ROSTER) buildBelt(ROSTER.companions);
    if (!first){ buildFaces(); if (ST.name === 'IDLE' || ST.name === 'FACES') tintHome(); }
  }
  att(el.avatar, 'aria-label', ME.label ? tt('aria.account', { name: ME.label }) : tt('aria.accountPlain'));
  att(el.close, 'aria-label', tt('aria.close'));
  setXpArc(s.level && s.level.progress);
}
function refreshCollections(){
  bcall('theses').then(function(r){ if (r && Array.isArray(r.items)) LEDGER = r.items; if (ST.name === 'IDLE') buildFaces(); }).catch(noop);
  bcall('island').then(function(i){ ISLAND = i; if (ST.name === 'IDLE') buildFaces(); }).catch(noop);
  bcall('roster').then(function(r){ ROSTER = r; if (r) buildBelt(r.companions); }).catch(noop);
}
function wire(){
  if (!BR) return;
  BR.on('session.changed', function(s){ applySession(s, false); if (ST.name === 'IDLE') pillMode(idleMode()); });
  BR.on('app.state', function(p){ fsmEvent('app.state', p); if (p && p.state === 'active') last = -1; });
  BR.on('ask.stage', onStage);
  BR.on('speech.state', function(p){ fsmEvent('speech.state', p); });
  BR.on('speech.level', function(p){ SPEECH.lvl = clamp(+(p && p.level) || 0, 0, 1); SPEECH.at = clk; });
  BR.on('speech.partial', function(p){ fsmEvent('speech.partial', p); });
  BR.on('speech.final', function(p){ fsmEvent('speech.final', p); });
  BR.on('speech.error', function(p){ fsmEvent('speech.error', p); });
  BR.on('voice.start', function(p){
    if (!p || p.id !== VOICE.id) return;
    VOICE.started = true; VOICE.engine = p.engine || null;
    VOICE.lat = clamp(lerp(VOICE.lat, clk - VOICE.reqT, 0.6), 0.15, 3.5);
    K.on = true; K.t = 0; K.mode = 'read';
    if (fin(p.durationSec) && p.durationSec > 0) kRetime(p.durationSec);
  });
  BR.on('voice.level', function(p){ if (p && p.id === VOICE.id){ VOICE.lvl = clamp(+p.level || 0, 0, 1); VOICE.at = clk; } });
  BR.on('voice.progress', function(p){
    if (!p || p.id !== VOICE.id || K.mode === 'word') return;
    K.mode = 'progress';
    if (fin(p.duration) && p.duration > 0 && (!K.dur || Math.abs(p.duration - K.dur) > 0.05 * K.dur)) kRetime(p.duration);
    if (fin(p.t)){ var d = p.t - K.t; if (Math.abs(d) > 0.06) K.t = p.t; else K.t += d * 0.3; }
  });
  BR.on('voice.word', function(p){ if (!p || p.id !== VOICE.id) return; K.mode = 'word'; var w = K.wt[p.index | 0]; if (w && Math.abs(K.t - w.t0) > 0.08) K.t = w.t0; });
  BR.on('voice.end', function(p){ if (!p || p.id !== VOICE.id) return; VOICE.ended = true; if (!VOICE.started || p.reason !== 'finished') VOICE.silent = true; fsmEvent('voice.end', p); });
  BR.on('thesis.planted', function(){ bcall('island').then(function(i){ ISLAND = i; }).catch(noop); });
  BR.on('native.sheet', function(p){ SHEET = !!(p && p.state === 'open'); last = -1; if (!SHEET) refreshCollections(); });
}
