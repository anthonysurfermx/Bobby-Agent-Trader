name: PTS
options:
  developmentLanguage: es
  deploymentTarget:
    iOS: '17.0'
targets:
  PTS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
      - ../Bobby/Sources/BobbyOrb.swift
      - ../Bobby/Sources/NeuralVoice.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.protradingskills.app
        DEVELOPMENT_TEAM: QZRTV6CMTT
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: '5.9'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) PTS_DEMO'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '4'
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PTS
        NSMicrophoneUsageDescription: "PTS usa el micrófono para que converses con el Copiloto sobre las señales."
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Black launch screen: no white flash before the splash.
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  PTSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PTS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.protradingskills.app.uitests
        DEVELOPMENT_TEAM: QZRTV6CMTT
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.9'
schemes:
  PTS:
    build:
      targets:
        PTS: all
    test:
      targets: [PTSUITests]
