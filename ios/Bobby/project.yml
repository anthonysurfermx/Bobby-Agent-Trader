name: Bobby
options:
  bundleIdPrefix: xyz.bobbyprotocol
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: "0.5.0"
schemes:
  Bobby:
    build:
      targets:
        Bobby: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BobbyTests
        - BobbyUITests
targets:
  BobbyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      # Núcleo golden bridge replies (ARCHITECTURE.md §4.2), read by NucleoBridgeTests.
      - path: Nucleo/fixtures/ask
        type: folder
        buildPhase: resources
    dependencies:
      - target: Bobby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bobbyprotocol.bobby.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QZRTV6CMTT
  BobbyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Bobby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bobbyprotocol.bobby.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QZRTV6CMTT
        TEST_TARGET_NAME: Bobby
  Bobby:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: Resources/Mascots
        buildPhase: resources
      - path: Resources/Voice
        buildPhase: resources
      - path: Resources/Nucleo
        type: folder
        buildPhase: resources
      - path: ../../public/land/v1/gate-A
        type: folder
        buildPhase: resources
      - path: ../../public/land/v1/world-snapshot-v01.json
        buildPhase: resources
      - path: ../../public/land/v1/audio
        type: folder
        buildPhase: resources
    dependencies:
      - package: GLTFKit2
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Bobby
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: xyz.bobbyprotocol.bobby
            CFBundleURLSchemes:
              - bobbyprotocol
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - instagram-stories
        NSMicrophoneUsageDescription: "Bobby listens only while you hold the button, to hear your question."
        NSPhotoLibraryAddUsageDescription: "Bobby saves your skin card to Photos only when you tap Save Image."
        NSSpeechRecognitionUsageDescription: "Bobby turns your spoken question into text on this iPhone. The audio never leaves your device."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    entitlements:
      path: Bobby.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.xyz.bobbyprotocol.bobby]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bobbyprotocol.bobby
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QZRTV6CMTT
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "40"
