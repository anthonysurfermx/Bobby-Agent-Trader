name: Bobby
options:
  bundleIdPrefix: xyz.bobbyprotocol
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: "0.5.0"
schemes:
  Bobby:
    build:
      targets:
        Bobby: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BobbyUITests
targets:
  BobbyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Bobby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bobbyprotocol.bobby.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QZRTV6CMTT
        TEST_TARGET_NAME: Bobby
  Bobby:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: Resources/Mascots
        buildPhase: resources
    dependencies:
      - package: GLTFKit2
    entitlements:
      path: Bobby.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bobbyprotocol.bobby
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bobby
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bobby listens so you can ask about any asset out loud."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bobby turns your voice into questions about the markets. Audio is processed by Apple's speech recognition."
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QZRTV6CMTT
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "12"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
