name: Bobby
fileGroups:
  - Bobby.storekit
options:
  bundleIdPrefix: xyz.bobbyprotocol
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: "0.5.0"
  # Bobby Pro purchases on iOS (Nucleo/ARCHITECTURE.md §8.4): the App Store subscription through RevenueCat.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: "5.91.0"
schemes:
  Bobby:
    build:
      targets:
        Bobby: all
    run:
      config: Debug
      # Simulator purchases without App Store Connect (the local "Bobby Pro" group, $4.99 monthly).
      storeKitConfiguration: Bobby.storekit
    test:
      config: Debug
      targets:
        - BobbyTests
        - BobbyUITests
targets:
  BobbyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      # Núcleo golden bridge replies (ARCHITECTURE.md §4.2), read by NucleoBridgeTests.
      - path: Nucleo/fixtures/ask
        type: folder
        buildPhase: resources
    dependencies:
      - target: Bobby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bobbyprotocol.bobby.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QZRTV6CMTT
  BobbyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Bobby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bobbyprotocol.bobby.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QZRTV6CMTT
        TEST_TARGET_NAME: Bobby
  Bobby:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: Resources/Mascots
        buildPhase: resources
      - path: Resources/Voice
        buildPhase: resources
      - path: Resources/Nucleo
        type: folder
        buildPhase: resources
      - path: ../../public/land/v1/gate-A
        type: folder
        buildPhase: resources
      - path: ../../public/land/v1/world-snapshot-v01.json
        buildPhase: resources
      - path: ../../public/land/v1/audio
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Embed offline fixtures in Debug only
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            /usr/bin/ditto "$PROJECT_DIR/Nucleo/fixtures" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Nucleo/fixtures"
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            /usr/bin/python3 "$PROJECT_DIR/Nucleo/build.py" --contract-only --output "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Nucleo"
          fi
    dependencies:
      - package: GLTFKit2
      - package: RevenueCat
        product: RevenueCat
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Bobby
        CFBundleLocalizations: [en, es, fr, pt, it, de]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: xyz.bobbyprotocol.bobby
            CFBundleURLSchemes:
              - bobbyprotocol
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - instagram-stories
        NSMicrophoneUsageDescription: "Bobby listens only while you hold the button, to hear your question."
        NSPhotoLibraryAddUsageDescription: "Bobby saves your skin card to Photos only when you tap Save Image."
        NSSpeechRecognitionUsageDescription: "Bobby turns your spoken question into text: on this iPhone when the language is installed, otherwise through Apple's speech service. Bobby does not store the audio."
        # RevenueCat's PUBLIC iOS SDK key (appl_…), from the build setting below. Empty = purchases are off
        # and the Bobby Pro sheet says it opens soon (§8.4).
        REVENUECAT_IOS_API_KEY: $(REVENUECAT_IOS_API_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    entitlements:
      path: Bobby.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.xyz.bobbyprotocol.bobby]
        # Market briefing pushes use the APNs environment of the signing configuration.
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bobbyprotocol.bobby
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QZRTV6CMTT
        MARKETING_VERSION: "1.8"
        CURRENT_PROJECT_VERSION: "64"
      configs:
        # RevenueCat PUBLIC SDK keys (meant to ship in the app; not secret keys). Debug uses the dashboard's
        # Test Store key; Release uses the App Store app's public key (RevenueCat → API keys → SDK API keys,
        # "Bobby: Think Before You Trade (App Store)"). BobbyStore refuses any test_ key outside DEBUG.
        Debug:
          APS_ENVIRONMENT: development
          REVENUECAT_IOS_API_KEY: test_VxgXjDaVEnBXXAGIqrfZqfAzNod
        Release:
          APS_ENVIRONMENT: production
          REVENUECAT_IOS_API_KEY: appl_PTUeCLFEkmBVAkpFMdDmNRIbikp
